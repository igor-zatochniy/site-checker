name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  STATICCHECK_VERSION: "v0.7.0"
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  test:
    name: Test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module integrity
        run: go mod verify

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}

      - name: Run Staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Set up kubectl for manifest validation
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.32.2

      - name: Validate Kubernetes deployment paths
        run: |
          set -euo pipefail
          base_manifest="$(mktemp)"
          local_manifest="$(mktemp)"
          managed_manifest="$(mktemp)"
          kubectl kustomize deploy/kubernetes > "${base_manifest}"
          kubectl kustomize deploy/kubernetes-overlays/local-demo > "${local_manifest}"
          kubectl kustomize deploy/kubernetes-overlays/managed-backends > "${managed_manifest}"

          ! grep -q '^  name: site-checker-postgres$' "${base_manifest}"
          ! grep -q '^  name: site-checker-rabbitmq$' "${base_manifest}"
          test "$(grep -c '^  name: site-checker-postgres$' "${local_manifest}")" -eq 2
          test "$(grep -c '^  name: site-checker-rabbitmq$' "${local_manifest}")" -eq 2
          test "$(grep -c '^kind: NetworkPolicy$' "${managed_manifest}")" -eq 4
          test "$(grep -c 'port: 5432' "${managed_manifest}")" -eq 4
          test "$(grep -c 'port: 5671' "${managed_manifest}")" -eq 2
          test "$(grep -c 'port: 5672' "${managed_manifest}")" -eq 2
          test "$(grep -c 'cidr: 192.0.2.10/32' "${managed_manifest}")" -eq 4
          test "$(grep -c 'cidr: 198.51.100.10/32' "${managed_manifest}")" -eq 2

      - name: Verify rendered startup budgets and KEDA isolation
        env:
          KUBERNETES_RENDER_TEST: "1"
        run: go test ./internal/sitechecker -run 'TestKubernetes.*StartupBudgets|TestStartupProbeRejectsMigrationOnlyBudget|TestKEDABrokerIngressIsScopedToOperator' -count=1

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: site-checker:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: site-checker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: site-checker:ci
          artifact-name: site-checker-sbom.spdx.json
          output-file: site-checker-sbom.spdx.json
          upload-release-assets: false

      - name: Push scanned release image
        id: release-image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_tag="$(awk '$1 == "newTag:" { print $2 }' deploy/kubernetes/kustomization.yaml)"
          alerts_tag="$(awk '$1 == "newTag:" { print $2 }' deploy/kubernetes/alerts/kustomization.yaml)"
          test "${base_tag}" = "${RELEASE_TAG}"
          test "${alerts_tag}" = "${RELEASE_TAG}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release image tag ${RELEASE_TAG} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          docker tag site-checker:ci "${IMAGE_NAME}:${RELEASE_TAG}"
          docker tag site-checker:ci "${IMAGE_NAME}:sha-${COMMIT_SHA}"
          docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${IMAGE_NAME}:sha-${COMMIT_SHA}"
          IMAGE_DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          test -n "${IMAGE_DIGEST}"
          printf 'digest=%s\n' "${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Set up kubectl
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.32.2

      - name: Render immutable Kubernetes release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.release-image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "${IMAGE_DIGEST}"
          mkdir -p dist/release
          cat > dist/release/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../deploy/kubernetes
          images:
            - name: ghcr.io/igor-zatochniy/site-checker
              newName: ${IMAGE_NAME}
              digest: ${IMAGE_DIGEST}
          EOF
          kubectl kustomize dist/release > "dist/site-checker-kubernetes-${RELEASE_TAG}.yaml"
          printf '%s\n' "${IMAGE_NAME}@${IMAGE_DIGEST}" > "dist/site-checker-image-${RELEASE_TAG}.txt"
          cp site-checker-sbom.spdx.json "dist/site-checker-sbom-${RELEASE_TAG}.spdx.json"
          cp deploy/kubernetes-overlays/managed-backends/managed-backends-egress.yaml "dist/site-checker-managed-backends-egress-${RELEASE_TAG}.yaml"
          test "$(grep -cF "image: ${IMAGE_NAME}@${IMAGE_DIGEST}" "dist/site-checker-kubernetes-${RELEASE_TAG}.yaml")" -eq 3
          mkdir -p dist/release-alerts
          cat > dist/release-alerts/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../deploy/kubernetes/alerts
          images:
            - name: ghcr.io/igor-zatochniy/site-checker
              newName: ${IMAGE_NAME}
              digest: ${IMAGE_DIGEST}
          EOF
          kubectl kustomize dist/release-alerts > "dist/site-checker-alerts-${RELEASE_TAG}.yaml"
          test "$(grep -cF "image: ${IMAGE_NAME}@${IMAGE_DIGEST}" "dist/site-checker-alerts-${RELEASE_TAG}.yaml")" -eq 1
          (
            cd dist
            sha256sum \
              "site-checker-kubernetes-${RELEASE_TAG}.yaml" \
              "site-checker-alerts-${RELEASE_TAG}.yaml" \
              "site-checker-managed-backends-egress-${RELEASE_TAG}.yaml" \
              "site-checker-image-${RELEASE_TAG}.txt" \
              "site-checker-sbom-${RELEASE_TAG}.spdx.json" \
              > "site-checker-checksums-${RELEASE_TAG}.txt"
          )

      - name: Upload immutable Kubernetes release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-checker-kubernetes-${{ github.ref_name }}
          path: |
            dist/site-checker-kubernetes-${{ github.ref_name }}.yaml
            dist/site-checker-alerts-${{ github.ref_name }}.yaml
            dist/site-checker-managed-backends-egress-${{ github.ref_name }}.yaml
            dist/site-checker-image-${{ github.ref_name }}.txt
            dist/site-checker-sbom-${{ github.ref_name }}.spdx.json
            dist/site-checker-checksums-${{ github.ref_name }}.txt
          if-no-files-found: error

      - name: Publish immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Site Checker ${RELEASE_TAG}" \
            "dist/site-checker-kubernetes-${RELEASE_TAG}.yaml" \
            "dist/site-checker-alerts-${RELEASE_TAG}.yaml" \
            "dist/site-checker-managed-backends-egress-${RELEASE_TAG}.yaml" \
            "dist/site-checker-image-${RELEASE_TAG}.txt" \
            "dist/site-checker-sbom-${RELEASE_TAG}.spdx.json" \
            "dist/site-checker-checksums-${RELEASE_TAG}.txt"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags=integration ./...
