apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-checker-rabbitmq-keda-ingress
  namespace: site-checker
  labels:
    app.kubernetes.io/name: site-checker
    app.kubernetes.io/component: rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: site-checker
      app.kubernetes.io/component: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keda-operator
      ports:
        - protocol: TCP
          port: 5672
