    - Egress
  egress:
    - to:
        - ipBlock:
            # Replace with the smallest CIDR containing every managed PostgreSQL endpoint IP.
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            # Replace with the smallest CIDR containing every managed RabbitMQ endpoint IP.
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 5671
        - protocol: TCP
          port: 5672
