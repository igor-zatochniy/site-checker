apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-checker-api-managed-postgres-egress
  namespace: site-checker
  labels:
    app.kubernetes.io/name: site-checker
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: site-checker
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # Replace with the smallest CIDR containing every managed PostgreSQL endpoint IP.
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-checker-scheduler-managed-backends-egress
  namespace: site-checker
  labels:
    app.kubernetes.io/name: site-checker
    app.kubernetes.io/component: scheduler
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: site-checker
      app.kubernetes.io/component: scheduler
