apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-checker-trusted-private-egress
  namespace: site-checker
  labels:
    app.kubernetes.io/name: site-checker
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - worker
          - alert-dispatcher
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # Replace this example with the smallest trusted destination CIDR.
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
